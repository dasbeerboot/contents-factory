name: talking_head
kind: video
platforms: [tiktok, youtube, instagram]
aspect: "9:16"
duration_s: [23, 28]
questions:
  - key: video.th.location
    question_ko: "진행자가 어디에서 말하는 장면인가요?"
    question_en: "Where is the host speaking?"
  - key: video.th.outfit
    question_ko: "의상과 고정 룩은 무엇인가요?"
    question_en: "What outfit and locked visual look should the host keep?"
  - key: video.th.identity
    question_ko: "진행자의 정체성과 청중과의 관계를 어떻게 설명할까요?"
    question_en: "How should the host identity and relationship to the audience be described?"
  - key: video.th.hook_line
    question_ko: "첫 3초 안에 말할 훅 문장은 무엇인가요?"
    question_en: "What hook line should be spoken in the first 3 seconds?"
  - key: video.th.body_lines
    question_ko: "중간에 말할 핵심 문장 2~4개를 적어주세요."
    question_en: "List 2 to 4 core spoken lines for the middle."
  - key: video.th.endcard
    question_ko: "마지막 엔드카드 문구는 무엇인가요?"
    question_en: "What should the final end card say?"
# Positive description carries the weight. A noun inside a negative clause still
# names a thing for the model to picture, so listing the parts of a social app
# interface is how one gets drawn: the first version of this template forbade
# status bars and buttons and came back as a full screenshot. The negative line
# stays short and names only defects, never scenery.
still_prompt_template: |
  A photograph shot on a mirrorless camera with a 35mm lens, printed edge to edge.
  Subject: {{host_identity}}, mid-stride on an empty pavement, looking straight into the lens.
  Location: {{location}}
  Outfit: {{outfit}}
  Visual identity: {{identity}}
  Framing: chest-up to head, face square to the camera, face filling roughly 35 to 40 percent of frame height, placed slightly off-center.
  Face shape: short compact round face, wide open eyes, natural skin texture, visible pores.
  Arms: relaxed and swinging low beside the body, both elbows soft and bent.
  Background: the street behind her is quiet and deserted, with a pole, railing or kerb close to the camera on one side.
  Lighting: available daylight, consistent with the location.
  Negative: text, watermark, extra limbs, deformed hands, blurry, beauty filter, airbrushed skin, 3D render, illustration.
prompt_template: |
  The START IMAGE is the exact first frame and face reference for {{host_identity}}.
  Keep the face, outfit, opening composition, camera height, subject placement, background, and lighting from the start image.
  [Generation Goal] Generate a {{duration_s}}-second vertical video, one continuous take, no cuts.
  [Camera] One camera move only: handheld front-camera tracking shot.
  The phone travels forward with the host at walking pace through {{location}} for the entire take.
  The host talks warmly to the front camera as if speaking to a close friend.
  Natural gaze: roughly two thirds on the lens and one third away, never a fixed stare.
  Never show the phone, filming arm, camera operator, or a second person.
  Framing: chest-up to head framing at arm's length, face filling roughly 35 to 40 percent of frame height, slightly off-center.
  Visual identity: {{identity}}
  Outfit: {{outfit}}
  [Audio] Dialogue language: {{content_lang}}, normal volume, brisk and warm, about {{wpm}} words per minute. Only the host voice and {{ambience}}. No music.
  [Stage 1 | 0-0.3s] Opening. The host is already walking and begins talking almost immediately.
  [Stage 2 | 0.3-3s] The host says: {{hook_line}}
  [Stage 3 | 3-{{midpoint_s}}s] Continue with the body lines: {{body_lines}}
  [Stage 4 | {{midpoint_s}}-{{end_s}}s] Land the final spoken point and close the mouth after the last word.
  [Stage 5 | {{end_s}}-{{duration_s}}s] End card only: {{endcard}}
  [Maintain Consistency] One host, one face, same outfit, same selfie framing, same real background, walking forward the whole time.
  Negative: smaller eyes, altered face, face drift, phone in frame, visible filming arm, third hand, duplicate limbs, looking down, fixed stare, subtitles, on-screen text before the end card, readable background text, music, cuts, beauty filter, frozen background, background morphing, object warping.
gates: [caption_safe_zone, limb_motion, bg_motion, stt_wpm, identity, readable_text, start_freeze]
limits:
  width_px: 1080
  height_px: 1920
  wpm: [150, 185]
  first3s_events_min: 3
  # The take is rendered at 720p and upscaled on assembly. This is a budget
  # decision, not a quality preference: 24s at 1080p costs 288 credits against a
  # 150 cap, the same take at 720p costs 108.
  clip_resolution: 720p
  # The clip model speaks the dialogue itself, so the deliverable keeps the
  # take's own audio and the captions are timed by transcribing it.
  audio_source: clip
  caption_source: stt
  tts_chars_max: 2000
  platform_max_duration_s: {tiktok: 180, youtube: 180, instagram: 900}
  platform_recommended_aspect: {tiktok: "9:16", youtube: "9:16", instagram: "9:16"}
  min_resolution_px: {tiktok: [540, 960], youtube: [1080, 1920], instagram: [1080, 1920]}
  safe_zone_px: {x_min: 200, x_max: 880, y_min: 290, y_max: 1430}
  endcard_min_s: 2.5
credit_cap_per_item: 150
