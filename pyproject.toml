[project]
name = "contents-factory"
version = "0.1.0"
description = "Persona-agnostic content factory: interview-driven generation plus multi-platform scheduled publishing"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
